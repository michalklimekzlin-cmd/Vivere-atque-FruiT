<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090907">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>VaF'i'T · Bubínky</title>
<style>
:root{color-scheme:dark;--ink:#090907;--gold:#c79b33;--light:#ffe2ad;--paper:#fff0c5;--muted:#aaa292;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--paper);overscroll-behavior:none}
body{background:radial-gradient(circle at 50% -8%,rgba(199,155,51,.2),transparent 34%),radial-gradient(ellipse at 20% 70%,rgba(116,104,75,.1),transparent 55%),#090907}
#app{position:fixed;inset:0;padding:calc(9px + var(--safe-t)) 10px calc(8px + var(--safe-b));display:flex;flex-direction:column;gap:8px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}.brand{font-size:clamp(10px,2.5vw,14px);letter-spacing:.1em;text-transform:uppercase;color:var(--light);font-weight:800}.status{font-size:10px;color:var(--muted);text-align:right}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}button{font:inherit;color:var(--light);cursor:pointer;-webkit-tap-highlight-color:transparent}.tool{border:1px solid rgba(255,226,173,.22);border-radius:999px;padding:7px 10px;background:linear-gradient(180deg,#2b2114,#100d09);font-size:10px;touch-action:manipulation}.tool:active{transform:scale(.97)}
.help{font-size:10px;color:#aaa292;line-height:1.35;margin:0 2px}
#field{position:relative;flex:1;min-height:0;overflow:hidden;border-top:1px solid rgba(255,226,173,.12);border-bottom:1px solid rgba(255,226,173,.12);background:radial-gradient(ellipse at center,rgba(199,155,51,.06),transparent 70%)}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(3px,1vw,8px);padding:6px 1px}
.drum{position:relative;min-width:0;min-height:0;padding:0;border:1px solid rgba(255,226,173,.24);border-radius:13px;background:linear-gradient(145deg,rgba(255,226,173,.07),rgba(0,0,0,.48) 55%,rgba(199,155,51,.05));box-shadow:inset 0 1px rgba(255,240,197,.08),0 4px 9px #0004;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;perspective:500px}
.drum:before,.drum:after{content:"";position:absolute;left:8%;right:8%;height:1px;background:rgba(255,226,173,.2);pointer-events:none;z-index:3}.drum:before{top:22%}.drum:after{bottom:22%}
.cylinder{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transition:transform .28s cubic-bezier(.2,.7,.25,1)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:3px;color:var(--light);font-size:clamp(13px,3.2vw,24px);font-weight:600;letter-spacing:-.045em;text-shadow:0 0 10px rgba(255,226,173,.18);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;white-space:nowrap}
.face.back{transform:rotateY(180deg);color:#e4c98f;font-size:clamp(11px,2.7vw,20px);opacity:.94}
.drum.selected{border-color:rgba(255,226,173,.72);box-shadow:0 0 0 1px rgba(199,155,51,.2),0 0 15px rgba(199,155,51,.12),inset 0 0 18px rgba(255,226,173,.08)}
.drum.editing .face{color:#fff0c5}
.drum.is-dragging{border-color:var(--light);box-shadow:0 0 18px rgba(199,155,51,.28);transition:none}
footer{display:flex;justify-content:space-between;gap:8px;color:#aaa292;font-size:9px;line-height:1.3}
@media(orientation:landscape){#app{gap:5px}#grid{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:5px;padding:4px 2px}.toolbar{gap:4px}.tool{padding:5px 8px}.drum{border-radius:11px}.face{font-size:clamp(12px,2vw,20px)}.face.back{font-size:clamp(10px,1.6vw,16px)}}
@media(min-width:760px){#app{padding:16px 24px}#grid{gap:12px;padding:12px 5vw}.drum{border-radius:17px}}
@media(prefers-reduced-motion:reduce){.cylinder{transition:none}}
</style></head>
<body><main id="app">
<header><div class="brand">VaF'i'T · bubínková síť</div><div id="status" class="status" aria-live="polite">48 bubínků · lokální paměť</div></header>
<nav class="toolbar" aria-label="Nástroje mřížky"><button class="tool" id="add" type="button">＋ Bubínek</button><button class="tool" id="edit" type="button">Upravit vybraný</button><button class="tool" id="export" type="button">Záloha ↓</button><button class="tool" id="import" type="button">Obnovit ↑</button><button class="tool" id="reset" type="button">Výchozí pořadí</button><input id="file" type="file" accept="application/json,.json" hidden></nav>
<p class="help">Každý bubínek má dva VaF'i'T za sebou. Táhni prstem zleva doprava nebo zprava doleva a vyměň je jako váleček. Klepnutím upravíš oba znaky.</p>
<section id="field" aria-label="Bubínková síť VaF'i'T"><div id="grid"></div></section>
<footer><span>Vodorovné otáčení · žádné svislé salto</span><span>CHT 360°‰. · VaF'i'T</span></footer>
</main>
<script>
(()=>{'use strict';
const KEY='vafit-pocket-grid-v1',COUNT=48,grid=document.querySelector('#grid'),field=document.querySelector('#field'),status=document.querySelector('#status');
const seed=['९נֶ',"'i'",'•ア','7i_','ī´','ˇ°i°ˇ','.•cU•.','}{','(•.(•.)ア','101','CHT','V','E','R','·','°','‰','(\\*/) ',':D','Love',"VaF'i'T",'•N','ı>o','_||_','•Z<','(ง •̀_•́)ง','ア','∴','Ø','(۶•̀ᴗ•́)۶','•.•','T','Glyph','Vive','Batole','Revia','∞','∿','☼','९נֶ','ı','i','•','°&','(._.)','(ง)','c(_)','-:x:-'];
let items=[],selected=null,drag=null,suppressClickId=null;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n)),mod=(n,m)=>((n%m)+m)%m;
function defaults(){return seed.slice(0,COUNT).map((value,i)=>({id:'vf-'+String(i+1).padStart(3,'0'),value,back:'',turn:0,custom:false}));}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.items)&&d.items.length){items=d.items.slice(0,120).map((it,i)=>({id:String(it.id||'vf-'+i),value:String(it.value||'·').slice(0,24),back:String(it.back||it.mate||'').slice(0,24),turn:Number.isFinite(it.turn)?mod(it.turn,2):0,custom:Boolean(it.custom)}));}else items=defaults();}catch(_){items=defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:2,updatedAt:new Date().toISOString(),items}));status.textContent=items.length+' bubínků · uloženo';}catch(_){status.textContent='Úložiště plné — exportuj zálohu';}}
function makeFace(cls,text){const el=document.createElement('span');el.className=cls;el.textContent=text||'＋';return el;}
function render(){grid.textContent='';items.forEach((it,i)=>{const p=document.createElement('button');p.type='button';p.className='drum'+(it.id===selected?' selected':'');p.dataset.id=it.id;p.setAttribute('aria-label','Bubínek '+(i+1)+': '+it.value+' / '+(it.back||'prázdné místo')+'. Táhni vodorovně pro otočení, klepni pro úpravu.');
const cyl=document.createElement('span');cyl.className='cylinder';cyl.style.transform='rotateY('+(it.turn*180)+'deg)';cyl.append(makeFace('face',it.value),makeFace('face back',it.back));p.append(cyl);
p.addEventListener('pointerdown',e=>start(e,it,p));p.addEventListener('pointermove',move);p.addEventListener('pointerup',end);p.addEventListener('pointercancel',cancel);p.addEventListener('click',()=>{if(suppressClickId===it.id){suppressClickId=null;return;}if(drag?.moved)return;selected=it.id;renderSelection();editItem(it);});grid.append(p);});status.textContent=items.length+' bubínků · lokální paměť';}
function renderSelection(){grid.querySelectorAll('.drum').forEach(el=>el.classList.toggle('selected',el.dataset.id===selected));}
function start(e,it,p){if(e.pointerType==='mouse'&&e.button!==0)return;drag={id:it.id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,originTurn:it.turn,moved:false,el:p};p.setPointerCapture?.(e.pointerId);selected=it.id;renderSelection();}
function move(e){if(!drag||drag.pointerId!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){drag.moved=true;drag.el.classList.add('is-dragging');const it=items.find(x=>x.id===drag.id);if(!it)return;const steps=Math.trunc(dx/42);it.turn=mod(drag.originTurn+steps,2);const cyl=drag.el.querySelector('.cylinder');if(cyl)cyl.style.transform='rotateY('+(drag.originTurn*180+steps*180)+'deg)';}else if(Math.abs(dy)>16&&Math.abs(dy)>Math.abs(dx)*1.2){drag.vertical=true;}}
function end(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;d.el.classList.remove('is-dragging');if(d.moved){const it=items.find(x=>x.id===d.id);if(it){it.turn=mod(d.originTurn+Math.round((e.clientX-d.startX)/42),2);save();suppressClickId=d.id;}}drag=null;if(d.moved)render();}
function cancel(e){if(!drag||drag.pointerId!==e.pointerId)return;drag.el.classList.remove('is-dragging');drag=null;render();}
function editItem(it){const a=prompt('Přední VaF\'i\'T:',it.value);if(a===null)return;const b=prompt('Druhý VaF\'i\'T za ním (nech prázdné, pokud zatím nechceš):',it.back||'');if(b===null)return;it.value=a.trim().slice(0,24)||it.value;it.back=b.trim().slice(0,24);save();render();}
document.querySelector('#add').addEventListener('click',()=>{if(items.length>=120){alert('Maximum je 120 bubínků.');return;}const a=prompt('První VaF\'i\'T:',"'i'");if(a===null||!a.trim())return;const b=prompt('Druhý VaF\'i\'T (volitelné):','');if(b===null)return;const id='vf-'+Date.now().toString(36);items.push({id,value:a.trim().slice(0,24),back:b.trim().slice(0,24),turn:0,custom:true});selected=id;save();render();});
document.querySelector('#edit').addEventListener('click',()=>{const it=items.find(x=>x.id===selected);if(it)editItem(it);else alert('Nejdřív vyber bubínek.');});
document.querySelector('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:2,items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vafit-bubinky-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.querySelector('#import').addEventListener('click',()=>document.querySelector('#file').click());
document.querySelector('#file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error('invalid');items=d.items.slice(0,120).map((it,i)=>({id:String(it.id||'vf-'+i),value:String(it.value||'·').slice(0,24),back:String(it.back||it.mate||'').slice(0,24),turn:mod(Number(it.turn)||0,2),custom:Boolean(it.custom)}));selected=null;save();render();}catch(_){alert('Soubor není platná záloha VaF\'i\'T bubínků.');}e.target.value='';});
document.querySelector('#reset').addEventListener('click',()=>{if(!confirm('Obnovit výchozí pořadí? Tvoje znaky zůstanou zachované.'))return;items.forEach(it=>it.turn=0);save();render();});
load();render();
})();
</script></body></html>
