<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090907"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>VaF'i'T · Bubínek 10</title>
<style>
:root{color-scheme:dark;--ink:#090907;--light:#ffe2ad;--paper:#fff0c5;--muted:#aaa292;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--ink);color:var(--paper);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 50% 0,rgba(199,155,51,.2),transparent 45%),linear-gradient(150deg,#17100a,#080706 68%);overscroll-behavior:none}
#app{min-height:100dvh;padding:calc(12px + var(--safe-t)) 12px calc(14px + var(--safe-b));max-width:920px;margin:auto;display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:clamp(12px,3vw,16px);letter-spacing:.1em;text-transform:uppercase;color:var(--light);font-weight:850}.status{font-size:11px;color:var(--muted);text-align:right}.toolbar{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;color:var(--light);cursor:pointer;-webkit-tap-highlight-color:transparent}.tool{border:1px solid rgba(255,226,173,.24);border-radius:999px;padding:8px 12px;background:linear-gradient(180deg,#2b2114,#100d09);font-size:11px;touch-action:manipulation}.help{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
#drums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}.drum{position:relative;min-width:0;padding:12px;border:1px solid rgba(255,226,173,.26);border-radius:22px;background:radial-gradient(ellipse at 50% 0,rgba(255,226,173,.1),transparent 55%),linear-gradient(145deg,#21180e,#0b0907 75%);box-shadow:inset 0 1px rgba(255,240,197,.1),0 9px 20px #0006;overflow:hidden}.drum-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}.drum-title{font-size:11px;letter-spacing:.08em;color:#d4b77b;font-weight:800}.edit{border:1px solid rgba(255,226,173,.2);border-radius:999px;padding:5px 8px;background:#17110b;font-size:10px}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;perspective:600px}.slot{min-width:0;min-height:49px;display:grid;place-items:center;padding:4px 2px;border:1px solid rgba(255,226,173,.2);border-radius:10px;background:linear-gradient(160deg,rgba(255,226,173,.09),rgba(0,0,0,.35));color:var(--light);font-size:clamp(12px,3.3vw,20px);line-height:1.05;text-align:center;overflow-wrap:anywhere;word-break:break-word;box-shadow:inset 0 1px rgba(255,255,255,.035);touch-action:manipulation}.slot.empty{color:rgba(255,226,173,.27)}.slot:focus-visible{outline:2px solid var(--light);outline-offset:2px}.drum-foot{margin-top:8px;color:#8e8068;font-size:9px;display:flex;justify-content:space-between;gap:5px}
@media(min-width:680px){#drums{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.drum{padding:16px}.slot{min-height:60px;font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main id="app"><header><div class="brand">VaF'i'T · bubínek × 10</div><div id="status" class="status" aria-live="polite">10 bubínků · 10 míst v každém</div></header>
<nav class="toolbar" aria-label="Nástroje"><button class="tool" id="add" type="button">＋ Přidat bubínek</button><button class="tool" id="export" type="button">Záloha ↓</button><button class="tool" id="import" type="button">Obnovit ↑</button><button class="tool" id="reset" type="button">Výchozí</button><input id="file" type="file" accept="application/json,.json" hidden></nav>
<p class="help">Každý bubínek má 10 míst pro VaF'i'T. Klepni na místo a napiš znak nebo celý glyph — klidně i delší jako <b>९נֶ ​._;´/</b>. Změny se ukládají v tomto zařízení. Zatím nic nezamykáme.</p><section id="drums" aria-label="Bubínky VaF'i'T"></section></main>
<script>
(()=>{'use strict';const KEY='vafit-drum-ten-slots-v1',MAX_DRUMS=30,SLOTS=10,root=document.querySelector('#drums'),status=document.querySelector('#status');const starters=[["'i'","९נֶ","•ア","7i_","Vive","Batole","CHT","°&","(._.)","Love"],["९נֶ","._;´/","Vivere","atque","Fru'i'T","•ア","","","",""]];let drums=[],nextId=1;
function fresh(label){return{id:'drum-'+(nextId++),label:label||'Bubínek',slots:Array(SLOTS).fill('')}}function defaults(){nextId=1;drums=Array.from({length:10},(_,i)=>{const d=fresh('Bubínek '+String(i+1).padStart(2,'0'));if(i===0)d.slots=[...starters[0]];if(i===1)d.slots=[...starters[1]];return d})}
function normalize(d,i){return{id:String(d.id||'drum-'+(i+1)),label:String(d.label||'Bubínek '+(i+1)).slice(0,32),slots:Array.from({length:SLOTS},(_,j)=>String(d.slots?.[j]??'').slice(0,40))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,nextId,drums}));status.textContent=drums.length+' bubínků · uloženo'}catch(_){status.textContent='Paměť plná — vytvoř zálohu'}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.drums)&&d.drums.length){nextId=Number(d.nextId)||1;drums=d.drums.slice(0,MAX_DRUMS).map(normalize);return}}catch(_){}defaults()}
function editSlot(d,j){const v=prompt('Bubínek: '+d.label+' · místo '+(j+1)+'\nZadej VaF\'i\'T nebo celý glyph:',d.slots[j]);if(v===null)return;d.slots[j]=v.trim().slice(0,40);save();render()}
function render(){root.textContent='';drums.forEach((d,i)=>{const card=document.createElement('article');card.className='drum';const head=document.createElement('div');head.className='drum-head';const title=document.createElement('div');title.className='drum-title';title.textContent=d.label;const edit=document.createElement('button');edit.type='button';edit.className='edit';edit.textContent='Přejmenovat';edit.addEventListener('click',()=>{const v=prompt('Název bubínku:',d.label);if(v===null)return;d.label=v.trim().slice(0,32)||d.label;save();render()});head.append(title,edit);const slots=document.createElement('div');slots.className='slots';d.slots.forEach((value,j)=>{const b=document.createElement('button');b.type='button';b.className='slot'+(!value?' empty':'');b.textContent=value||'＋';b.setAttribute('aria-label','Místo '+(j+1)+(value?': '+value:', prázdné'));b.addEventListener('click',()=>editSlot(d,j));slots.append(b)});const foot=document.createElement('div');foot.className='drum-foot';const left=document.createElement('span');left.textContent='10 míst';const right=document.createElement('span');right.textContent=d.slots.filter(Boolean).length+' obsazeno';foot.append(left,right);card.append(head,slots,foot);root.append(card)});status.textContent=drums.length+' bubínků · 10 míst v každém')}
document.querySelector('#add').addEventListener('click',()=>{if(drums.length>=MAX_DRUMS){alert('Maximum je '+MAX_DRUMS+' bubínků.');return}drums.push(fresh('Bubínek '+String(drums.length+1).padStart(2,'0')));save();render()});
document.querySelector('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,nextId,drums},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vafit-bubinky-10-mist.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.querySelector('#import').addEventListener('click',()=>document.querySelector('#file').click());document.querySelector('#file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.drums))throw Error('invalid');drums=d.drums.slice(0,MAX_DRUMS).map(normalize);nextId=Number(d.nextId)||drums.length+1;save();render()}catch(_){alert('Soubor není platná záloha bubínků.')}e.target.value=''});
document.querySelector('#reset').addEventListener('click',()=>{if(!confirm('Obnovit výchozích 10 bubínků? Nejprve si případně vytvoř zálohu.'))return;defaults();save();render()});load();render()})();
</script></body></html>
