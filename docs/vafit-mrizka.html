<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.json"><title>VaF'i'T · Kapsičková mřížka</title>
<style>
:root{color-scheme:dark;--bg:#100d09;--gold:#e8c27b;--gold-hi:#fff0c9;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--gold-hi);overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 42%,rgba(173,116,38,.2),transparent 54%),linear-gradient(145deg,#100d08,#21180c 52%,#090806)}#app{position:fixed;inset:0;overflow:hidden;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));isolation:isolate}#app:before{content:"";position:absolute;inset:-30%;z-index:-2;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 72px,rgba(232,194,123,.045) 73px 74px,transparent 75px 112px);animation:none}#app:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(90deg,transparent calc(100% - 1px),rgba(232,194,123,.075) calc(100% - 1px)),linear-gradient(0deg,transparent calc(100% - 1px),rgba(232,194,123,.075) calc(100% - 1px));background-size:10% 10%;mask-image:radial-gradient(ellipse,black,transparent 88%)}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}.brand{font-size:clamp(11px,2.7vw,15px);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:750;text-shadow:0 0 20px #a8762d66}.status{font-size:10px;color:#c7b48e;text-align:right}.toolbar{position:relative;z-index:10;display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}button{font:inherit;color:var(--gold-hi);cursor:pointer;-webkit-tap-highlight-color:transparent}.tool{border:1px solid rgba(232,194,123,.3);border-radius:999px;padding:8px 12px;background:linear-gradient(180deg,#3b2b17aa,#100d09d9);box-shadow:inset 0 1px #ffe7b21c,0 5px 18px #0005;font-size:11px;touch-action:manipulation}.tool:active{transform:scale(.97)}
#field{position:absolute;inset:112px 7px calc(38px + var(--safe-b));touch-action:none;overflow:hidden}#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(5px,1.8vw,13px);padding:7px 3px}
.pocket{position:relative;min-width:0;min-height:0;border:0;border-radius:50%;background:transparent;box-shadow:none;display:grid;place-items:center;perspective:none;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;transition:filter .15s;overflow:visible}.pocket:before{content:"";position:absolute;width:150%;height:118%;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,.02) 0 23%,rgba(0,0,0,.22) 46%,rgba(232,194,123,.12) 59%,rgba(232,194,123,.025) 68%,transparent 74%);box-shadow:inset 0 2px 8px #0006;pointer-events:none;z-index:0}.pocket.selected{filter:drop-shadow(0 0 8px rgba(245,217,154,.26))}
.token{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:2px;border:0;border-radius:0;background:transparent;box-shadow:none;color:#f7dfaa;font-size:clamp(15px,3.4vw,25px);font-weight:500;letter-spacing:-.04em;text-shadow:0 1px 5px #f7d58c33;transform:none;animation:none;will-change:auto;pointer-events:none;white-space:nowrap}.token.long{font-size:clamp(10px,2.2vw,16px);letter-spacing:-.07em}.token:after{content:none}.pocket.dragging{z-index:8;filter:brightness(1.25);transition:none}.pocket.dragging .token{animation-play-state:paused}.pocket.flip .token{animation:backflip .55s ease-out both}
footer{position:absolute;z-index:10;left:14px;right:14px;bottom:calc(8px + var(--safe-b));display:flex;justify-content:space-between;gap:10px;color:#c7b48e99;font-size:10px;pointer-events:none}
to{rotate:-360deg}}@keyframes backflip{0%{transform:scale(1)}45%{transform:translateY(-8%) scale(.72);filter:brightness(.65)}72%{transform:translateY(3%) scale(1.08)}100%{transform:scale(1)}}45%{transform:translateY(-15%) translateZ(-70px) rotateX(180deg) scale(.56);filter:brightness(.65)}72%{transform:translateY(-5%) translateZ(12px) rotateX(320deg) scale(1.05)}100%{transform:translateY(0) rotateX(360deg) scale(1)}}to{transform:rotate(360deg)}}
@media(orientation:landscape){#field{inset:102px 10px calc(34px + var(--safe-b))}#grid{grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(7px,1.1vw,14px);padding:6px 10px}.token{font-size:clamp(13px,1.9vw,21px)}.token.long{font-size:clamp(9px,1.2vw,13px)}}@media(min-width:760px){#field{inset:118px 5vw calc(48px + var(--safe-b))}#grid{gap:14px;padding:12px 4vw}.pocket{border-radius:20px}.token{max-width:104px;max-height:84px}}@media(prefers-reduced-motion:reduce){#app:before{animation:none}.token{animation-duration:120s}.pocket.flip .token{animation-duration:.01ms}}
</style></head><body><main id="app"><header><div class="brand">VaF'i'T · kapsičková síť</div><div class="status" id="status" aria-live="polite">48 míst · lokální paměť</div></header>
<nav class="toolbar" aria-label="Nástroje mřížky"><button class="tool" id="add" type="button">＋ VaF'i'T</button><button class="tool" id="edit" type="button">Upravit vybraný</button><button class="tool" id="export" type="button">Záloha ↓</button><button class="tool" id="import" type="button">Obnovit ↑</button><button class="tool" id="reset" type="button">Obnovit rozložení</button><input id="file" type="file" accept="application/json,.json" hidden></nav>
<section id="field" aria-label="Volně pohyblivá síť VaFiT"><div id="grid"></div></section><footer><span>Táhni VaFiT kamkoli · klepni pro salto</span><span>otáčení proti směru hodin · uložené v zařízení</span></footer></main>
<script>
(()=>{'use strict';
const KEY='vafit-pocket-grid-v1',COUNT=48,grid=document.querySelector('#grid'),field=document.querySelector('#field'),status=document.querySelector('#status');
const seed=['९נֶ',"'i'",'•ア','7i_','ī´','ˇ°i°ˇ','.•cU•.','}{','(•.(•.)ア','101','CHT','V','E','R','·','°','‰','(\\*/) ',':D','Love',"VaF'i'T",'•N','ı>o','_||_','•Z<','(ง •̀_•́)ง','ア','∴','Ø','(۶•̀ᴗ•́)۶','•.•','T','Glyph','Vive','Batole','Revia','∞','∿','☼','९נֶ','ı','i','•','°&','(._.)','(ง)','c(_)','-:x:-'];
let items=[],selected=null,drag=null,suppressClickId=null;const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function defaults(){return seed.slice(0,COUNT).map((value,i)=>({id:'vf-'+String(i+1).padStart(3,'0'),value,mate:'',x:null,y:null,custom:false}));}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.items)&&d.items.length){items=d.items.slice(0,120).map((it,i)=>({id:String(it.id||'vf-'+i),value:String(it.value||'·').slice(0,24),mate:String(it.mate||'').slice(0,16),x:Number.isFinite(it.x)?it.x:null,y:Number.isFinite(it.y)?it.y:null,custom:Boolean(it.custom)}));}else items=defaults();}catch(_){items=defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,updatedAt:new Date().toISOString(),items}));status.textContent=items.length+' míst · uloženo lokálně';}catch(_){status.textContent='Úložiště plné — exportuj zálohu';}}
function placeInitial(){const w=field.clientWidth,h=field.clientHeight,cols=matchMedia('(orientation:landscape)').matches?8:6,rows=Math.ceil(items.length/cols);items.forEach((it,i)=>{if(it.x===null||it.y===null){it.x=((i%cols)+.5)/cols*w;it.y=(Math.floor(i/cols)+.5)/rows*h;}});}
function render(){grid.textContent='';placeInitial();items.forEach((it,i)=>{const p=document.createElement('button');p.type='button';p.className='pocket'+(it.id===selected?' selected':'');p.dataset.id=it.id;p.setAttribute('aria-label','VaFiT '+it.value+(it.mate?' a '+it.mate:' a volné místo pro druhou VaFiT')+'. Táhni pro přesunutí, klepni pro salto, dvojklepnutím uprav.');p.style.position='absolute';p.style.left=it.x+'px';p.style.top=it.y+'px';p.style.width=(matchMedia('(orientation:landscape)').matches?Math.max(38,(field.clientWidth-45)/8-9):Math.max(34,(field.clientWidth-35)/6-7))+'px';p.style.height=(matchMedia('(orientation:landscape)').matches?Math.max(38,(field.clientHeight-40)/5-8):Math.max(34,(field.clientHeight-45)/8-8))+'px';p.style.transform='translate(-50%,-50%)';p.style.zIndex=it.id===selected?'5':'1';const t=document.createElement('span');t.className='token'+(Math.max(it.value.length,it.mate.length)>5?' long':'');const main=document.createElement('span');main.className='glyph';main.textContent=it.value;const mate=document.createElement('span');mate.className='glyph mate'+(it.mate?'':' empty');mate.textContent=it.mate||'＋';t.append(main,mate);p.append(t);p.addEventListener('pointerdown',e=>startDrag(e,it,p));p.addEventListener('pointermove',moveDrag);p.addEventListener('pointerup',endDrag);p.addEventListener('pointercancel',cancelDrag);p.addEventListener('dblclick',e=>{e.preventDefault();editItem(it);});p.addEventListener('click',()=>{if(suppressClickId===it.id){suppressClickId=null;return;}if(drag?.moved)return;selected=it.id;document.querySelectorAll('.pocket').forEach(n=>n.classList.toggle('selected',n.dataset.id===selected));p.classList.remove('flip');void p.offsetWidth;p.classList.add('flip');setTimeout(()=>p.classList.remove('flip'),780);});grid.append(p);});}
function startDrag(e,it,p){if(e.pointerType==='mouse'&&e.button!==0)return;drag={id:it.id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,originX:it.x,originY:it.y,moved:false,el:p};p.setPointerCapture?.(e.pointerId);selected=it.id;p.classList.add('selected');}
function moveDrag(e){if(!drag||drag.pointerId!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(!drag.moved)return;const it=items.find(x=>x.id===drag.id);if(!it)return;const r=field.getBoundingClientRect();it.x=clamp(drag.originX+dx,18,r.width-18);it.y=clamp(drag.originY+dy,18,r.height-18);drag.el.style.left=it.x+'px';drag.el.style.top=it.y+'px';drag.el.classList.add('dragging');}
function endDrag(e){if(!drag||drag.pointerId!==e.pointerId)return;const didMove=drag.moved;drag.el.classList.remove('dragging');if(didMove)save();const id=drag.id;drag=null;if(didMove){suppressClickId=id;selected=id;render();}}
function cancelDrag(e){if(!drag||drag.pointerId!==e.pointerId)return;drag.el.classList.remove('dragging');drag=null;render();}
function editItem(it){const v=prompt('První VaFiT (max. 24 znaků):',it.value);if(v===null)return;const s=v.trim().slice(0,24);if(!s){if(confirm('Odebrat toto místo i jeho dvojici ze sítě?'))items=items.filter(x=>x.id!==it.id);else return;}else{it.value=s;const m=prompt('Druhá VaFiT do stejné prohlubně. Nech prázdné, pokud ji zatím nechceš:',it.mate||'');if(m!==null)it.mate=m.trim().slice(0,16);}selected=it.id;save();render();}
document.querySelector('#add').addEventListener('click',()=>{if(items.length>=120){alert('Síť má nyní maximum 120 VaFiT.');return;}const value=prompt('Jakou VaFiT přidáme?',"'i'");if(value===null||!value.trim())return;const f=field.getBoundingClientRect(),id='vf-'+Date.now().toString(36);items.push({id,value:value.trim().slice(0,24),mate:'',x:f.width/2,y:f.height/2,custom:true});selected=id;save();render();const el=grid.querySelector('[data-id="'+CSS.escape(id)+'"]');el?.classList.add('flip');});
document.querySelector('#edit').addEventListener('click',()=>{const it=items.find(x=>x.id===selected);if(it)editItem(it);else alert('Nejdřív klepni na VaFiT.');});
document.querySelector('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vafit-mrizka-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.querySelector('#import').addEventListener('click',()=>document.querySelector('#file').click());
document.querySelector('#file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw new Error('missing items');items=d.items.slice(0,120).map((it,i)=>({id:String(it.id||'vf-'+i),value:String(it.value||'·').slice(0,24),x:Number.isFinite(it.x)?it.x:null,y:Number.isFinite(it.y)?it.y:null,custom:Boolean(it.custom)}));selected=null;save();render();}catch(_){alert('Soubor není platná záloha VaFiT mřížky.');}e.target.value='';});
document.querySelector('#reset').addEventListener('click',()=>{if(!confirm('Obnovit výchozí rozmístění? Tvoje znaky zůstanou zachované.'))return;items.forEach(it=>{it.x=null;it.y=null;});save();render();});
window.addEventListener('resize',()=>{const w=field.clientWidth,h=field.clientHeight;items.forEach(it=>{it.x=it.x===null?null:clamp(it.x,18,w-18);it.y=it.y===null?null:clamp(it.y,18,h-18);});render();});
load();requestAnimationFrame(()=>{render();save();});
})();
</script></body></html>
