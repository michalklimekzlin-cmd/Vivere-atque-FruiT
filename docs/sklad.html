<script>
(()=>{'use strict';const KEY='vafit-sklad-mista-v1',root=document.getElementById('beads');let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){saved={}}const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_){}};root.querySelectorAll('.bead').forEach(button=>{const id=button.dataset.slot,label=button.querySelector('span');if(saved[id]){label.textContent=saved[id];button.classList.add('filled')}button.addEventListener('click',()=>{if(button.querySelector('input'))return;const input=document.createElement('input');input.type='text';input.maxLength=32;input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-label','Název místa');input.value=saved[id]||'';input.placeholder="VaF'¡¡'T";button.replaceChildren(input);input.focus();input.select();const finish=()=>{const value=input.value.trim();if(value)saved[id]=value;else delete saved[id];persist();button.replaceChildren();const span=document.createElement('span');span.textContent=value||"VaF'¡¡'T";button.append(span);button.classList.toggle('filled',!!value)};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}if(e.key==='Escape'){input.value=saved[id]||'';input.blur()}});input.addEventListener('blur',finish,{once:true})})});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))})();
