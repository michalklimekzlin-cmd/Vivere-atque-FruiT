<title>VaF'¡¡'T · Síť korálků</title>
<style>
:root{color-scheme:dark;--gold:#f0d49a;--paper:#fff0c5;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090806;color:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,rgba(159,112,35,.16),transparent 58%),radial-gradient(ellipse at 50% 100%,#171008 0,#090806 72%)}
main{width:100%;height:100vh;height:100dvh;padding:calc(var(--safe-top) + 5px) 8px calc(var(--safe-bottom) + 5px);overflow:hidden}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(5px,1.8vw,9px);align-items:stretch;justify-items:stretch}
.drum{position:relative;min-width:0;min-height:0;width:100%;height:100%;display:grid;place-items:center;padding:3px;border:1px solid rgba(255,226,173,.43);border-radius:999px;background:radial-gradient(ellipse at 50% 38%,rgba(255,226,173,.18),transparent 54%),linear-gradient(155deg,rgba(22,19,13,.98),rgba(2,2,1,.94) 68%);box-shadow:inset 0 1px 0 rgba(255,226,173,.10),inset 0 0 22px rgba(255,226,173,.07),0 4px 16px rgba(0,0,0,.28);color:var(--gold);touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;overflow:hidden}
.drum:before,.drum:after{content:"";position:absolute;left:18%;right:18%;height:1px;background:rgba(255,226,173,.17);pointer-events:none}
.drum:before{top:22%}.drum:after{bottom:22%}
.drum strong{position:relative;z-index:2;display:block;max-width:100%;max-height:58%;overflow:hidden;padding:0 2px;color:var(--gold);font-size:clamp(20px,7vw,34px);font-weight:650;line-height:1;text-align:center;text-shadow:0 0 13px rgba(255,226,173,.5);overflow-wrap:anywhere;pointer-events:none}
.drum.dragging{border-color:rgba(255,226,173,.9);background:radial-gradient(circle at 50% 48%,rgba(255,226,173,.25),transparent 58%),rgba(2,2,1,.96);box-shadow:inset 0 0 24px rgba(255,226,173,.12),0 0 18px rgba(255,226,173,.12)}
/* Jemný oblouk korálků – střední sloupce klesají níže. */
.drum:nth-child(5n+1),.drum:nth-child(5n){transform:translateY(0)}
.drum:nth-child(5n+2),.drum:nth-child(5n+4){transform:translateY(4px)}
.drum:nth-child(5n+3){transform:translateY(8px)}
@media(max-height:700px){.drum strong{font-size:clamp(17px,6vw,28px)}}
@media(prefers-reduced-motion:no-preference){.drum{transition:filter .12s ease,border-color .12s ease,background .12s ease}.drum:active{filter:brightness(1.12)}}
</style>

<body>
<main aria-label="Síť 25 otočných VaF'¡¡'T korálků">
  <section class="grid" id="grid" aria-label="25 otočných korálků">
<button class="drum" type="button" aria-hidden="true"><strong>♧</strong></button>

<script>
(()=>{'use strict';
const KEY='vafit-25-rotating-drums-v2';
const symbols=['♧','Ⅲ','♫','7i_','¡','>°|°<','—;’/','•ア','(•.•)','LOL','CHT','V','E','R','·','°','%∞','()ア','D','Love',"VaF’i’T",'§}','O<','╪','Ž','ʒʃ','Я','Ø','(°.•).•)','∴','T','Glyph','Vive','Batole','Revia','∞','Ƨ','☼','♧','Ⅰ','¡','·','♙','(•.•)','(Λ)','ↄ',';ˣ','•','•ア'];
const grid=document.getElementById('grid');
const defaults=Array.from({length:25},(_,i)=>({id:i+1,slot:0,name:"VaF'¡¡'T"}));
let drums=defaults.map(d=>({...d}));
try{
 const saved=JSON.parse(localStorage.getItem(KEY)||'null');
 if(saved&&Array.isArray(saved.drums)&&saved.drums.length){
  drums=saved.drums.slice(0,25).map((d,i)=>({id:Number(d.id)||i+1,slot:Math.abs(Number(d.slot)||0)%symbols.length,name:String(d.name||"VaF'¡¡'T")}));
  while(drums.length<25)drums.push({id:drums.length+1,slot:0,name:"VaF'¡¡'T"});
 }
}catch(_){/* Při poškozeném úložišti bezpečně použijeme výchozí síť. */}
let gesture=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:2,drums}))}catch(_){}}
function valueOf(d){return symbols[((d.slot%symbols.length)+symbols.length)%symbols.length]}
function render(){
 grid.replaceChildren();
 drums.slice(0,25).forEach((d,i)=>{
  const b=document.createElement('button');b.type='button';b.className='drum';b.dataset.id=String(d.id);
  b.setAttribute('aria-label','Korálek '+(i+1)+': '+valueOf(d)+'. Tažením nahoru nebo dolů otočíš symbolem.');
  const value=document.createElement('strong');value.textContent=valueOf(d);b.append(value);
  b.addEventListener('pointerdown',startDrag);b.addEventListener('pointermove',moveDrag);b.addEventListener('pointerup',endDrag);b.addEventListener('pointercancel',endDrag);b.addEventListener('lostpointercapture',endDrag);
  grid.append(b);
 });
}
function startDrag(e){
 e.preventDefault();const d=drums.find(x=>x.id===Number(e.currentTarget.dataset.id));if(!d)return;
 gesture={id:d.id,lastY:e.clientY,carry:0,el:e.currentTarget,pointerId:e.pointerId};gesture.el.classList.add('dragging');
 try{gesture.el.setPointerCapture(e.pointerId)}catch(_){}
}
function moveDrag(e){
 if(!gesture||gesture.id!==Number(e.currentTarget.dataset.id)||gesture.pointerId!==e.pointerId)return;
 e.preventDefault();const dy=gesture.lastY-e.clientY;gesture.lastY=e.clientY;gesture.carry+=dy;let steps=0;
 while(Math.abs(gesture.carry)>=18){const dir=gesture.carry>0?1:-1;steps+=dir;gesture.carry-=dir*18}
 if(steps){const d=drums.find(x=>x.id===gesture.id);if(d){d.slot=(d.slot+steps+symbols.length*10)%symbols.length;const strong=gesture.el.querySelector('strong');strong.textContent=valueOf(d);gesture.el.setAttribute('aria-label','Otočný korálek: '+valueOf(d));save()}}
}
function endDrag(e){if(!gesture||gesture.id!==Number(e.currentTarget.dataset.id)||gesture.pointerId!==e.pointerId)return;gesture.el.classList.remove('dragging');gesture=null}
render();
})();
</script>
