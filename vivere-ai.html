<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vivere AI" />
  <link rel="manifest" href="./vivere-ai-manifest.json" />
  <title>Vivere AI</title>
  <style>
    :root {
      --bg: #0a0d18;
      --bg-2: #101827;
      --panel: rgba(20, 27, 39, 0.9);
      --panel-soft: rgba(18, 23, 36, 0.7);
      --border: #d8b86d;
      --gold: #f6d98b;
      --gold-2: #d9b15a;
      --text: #edf3ff;
      --muted: #a7b5d1;
      --user: #204d8c;
      --bot: rgba(214, 176, 92, 0.08);
      --ok: #64d194;
      --warn: #ffcc66;
      --danger: #ff7a7a;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, #070b13 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    }

    .app {
      width: min(900px, 100%);
      height: calc(100dvh - 28px);
      border: 1px solid rgba(214, 176, 92, 0.5);
      border-radius: 24px;
      background: rgba(12, 16, 24, 0.9);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(214, 176, 92, 0.35);
      background: rgba(16, 24, 39, 0.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(214,176,92,0.25), rgba(240,210,140,0.05));
      border: 1px solid rgba(214,176,92,0.6);
      color: var(--gold);
      font-weight: 900;
    }

    .title {
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    .status {
      font-size: 0.76rem;
      color: var(--ok);
      border: 1px solid rgba(100, 209, 148, 0.5);
      background: rgba(100, 209, 148, 0.08);
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(9,13,22,0.85), rgba(16, 24, 39, 0.9));
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px 16px 16px 6px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot);
      color: var(--text);
      border: 1px solid rgba(214,176,92,0.3);
      border-bottom-left-radius: 6px;
    }

    .composer {
      border-top: 1px solid rgba(214,176,92,0.3);
      padding: 14px 14px 12px;
      background: rgba(14, 18, 28, 0.96);
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    input[type="text"] {
      flex: 1;
      background: var(--panel-soft);
      color: var(--text);
      border: 1px solid rgba(214,176,92,0.38);
      border-radius: 12px;
      padding: 14px 15px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: rgba(246, 217, 139, 0.8);
      box-shadow: 0 0 0 2px rgba(246,217,139,0.12);
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1a1208;
      font-weight: 800;
      cursor: pointer;
      padding: 0 16px;
      min-width: 96px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .mini {
      appearance: none;
      background: rgba(214,176,92,0.08);
      color: var(--gold);
      border: 1px solid rgba(214,176,92,0.35);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(214,176,92,0.2);
      background: rgba(18, 23, 36, 0.5);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div class="title">Vivere AI</div>
      </div>
      <div class="status" id="status">Lokalní režim</div>
    </header>

    <main class="chat" id="chat"></main>

    <div class="composer">
      <div class="composer-row">
        <input id="input" type="text" placeholder="Napiš zprávu..." aria-label="Zpráva" />
        <button id="sendBtn" type="button">Poslat</button>
      </div>
      <div class="toolbar">
        <button class="mini" id="rotateBtn" type="button">Rotace klíče</button>
        <button class="mini" id="showLogBtn" type="button">Audit log</button>
        <button class="mini" id="resetBtn" type="button">Vymazat paměť</button>
      </div>
      <div class="card" id="meta">Paměť: připravena.</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'vivere_ai_personal_v1';

    function makeDefaultState() {
      return {
        apiKey: 'local-' + Math.random().toString(36).slice(2, 12),
        apiRotation: Date.now(),
        messages: [
          { role: 'bot', text: 'Ahoj. Jsem Vivere AI. Jsem osobní lokální asistentka pro tvůj projekt. Napiš mi cokoliv.' },
          { role: 'bot', text: 'Vše je uloženo lokálně v tomto zařízení. Tady se tvoří tvá osobní AI vrstva.' }
        ],
        audit: [
          { ts: Date.now(), text: 'AI inicializována' }
        ],
        workers: {
          validator: 'aktivní',
          keeper: 'aktivní',
          learner: 'aktivní'
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const s = makeDefaultState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
          return s;
        }
        return JSON.parse(raw);
      } catch {
        const s = makeDefaultState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        return s;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function logAudit(state, text) {
      state.audit.unshift({ ts: Date.now(), text });
      state.audit = state.audit.slice(0, 20);
      saveState(state);
    }

    function renderMessages(state) {
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      state.messages.forEach((entry) => {
        const el = document.createElement('div');
        el.className = 'message ' + (entry.role === 'user' ? 'user' : 'bot');
        el.textContent = entry.text;
        chat.appendChild(el);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function updateMeta(state) {
      const meta = document.getElementById('meta');
      const count = state.messages.length;
      meta.textContent = `Paměť: ${count} záznamů • Klíč: ${state.apiKey.slice(0, 10)}... • Agenti: ${Object.values(state.workers).join(', ')}`;
    }

    function generateReply(input, state) {
      const text = input.toLowerCase();

      if (text.includes('ahoj') || text.includes('hello') || text.includes('zdravím')) {
        return 'Ahoj. Jsem Vivere AI. Tady se tvoří tvá osobní AI vrstva. Co chceš dnes rozjet?';
      }
      if (text.includes('kdo jsi') || text.includes('co jsi')) {
        return 'Jsem Vivere AI — osobní AI vrstva založená na tvém repozitáři a tvých informacích. Ukládám se lokálně a pracuji jako tvoje digitální pracovní prostředí.';
      }
      if (text.includes('localstorage') || text.includes('paměť')) {
        return 'Paměť je lokální v tomto zařízení. To znamená, že informace zůstávají u tebe a nejsou veřejně přístupné mimo tvůj telefon nebo prohlížeč.';
      }
      if (text.includes('agent') || text.includes('pracovník')) {
        return 'Agenti: validator hlídá správnost, keeper udržuje informace a learner se učí. V osobním režimu pracují společně a chrání stav dat.';
      }
      if (text.includes('api') || text.includes('klíč')) {
        return 'API klíč je lokálně rotován v tomto zařízení. Každá rotace přebírá novou hodnotu a zapisuje se do místní paměti.';
      }
      if (text.includes('vivere') || text.includes('frui')) {
        return 'Vivere atque FruiT je tvůj osobní vývojový rámec. Může to být vědomostní systém, osobní asistent, archiv a učení v jednom.';
      }
      return 'Rozumím. Tvoje osobní AI vrstva se učí z tvých textů, dat a poznatků. Můžeme to rozvíjet v dalších úrovních — chat, učení, pracovníci, logy a paměť.';
    }

    function appendMessage(state, role, text) {
      state.messages.push({ role, text });
      if (state.messages.length > 40) state.messages = state.messages.slice(-40);
      saveState(state);
      renderMessages(state);
      updateMeta(state);
      logAudit(state, `${role}: ${text.slice(0, 80)}`);
    }

    function send() {
      const input = document.getElementById('input');
      const value = input.value.trim();
      if (!value) return;

      const state = loadState();
      appendMessage(state, 'user', value);
      const answer = generateReply(value, state);
      setTimeout(() => {
        const s = loadState();
        appendMessage(s, 'bot', answer);
        document.getElementById('status').textContent = 'Odpověď hotová';
        setTimeout(() => document.getElementById('status').textContent = 'Lokalní režim', 1200);
      }, 120);
      input.value = '';
    }

    function rotateKey() {
      const state = loadState();
      state.apiKey = 'local-' + Math.random().toString(36).slice(2, 18);
      state.apiRotation = Date.now();
      logAudit(state, 'API klíč rotován');
      saveState(state);
      updateMeta(state);
      alert('Klíč byl rotován v lokální paměti.');
    }

    function showAudit() {
      const state = loadState();
      const list = state.audit.slice(0, 8).map((item) => `${new Date(item.ts).toLocaleTimeString('cs-CZ')} — ${item.text}`).join('\n');
      alert(list || 'Audit log je prázdný.');
    }

    function resetMemory() {
      if (!confirm('Opravdu chceš vymazat osobní paměť a záznamy?')) return;
      const s = makeDefaultState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      renderMessages(s);
      updateMeta(s);
      document.getElementById('status').textContent = 'Paměť resetována';
    }

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') send();
    });
    document.getElementById('rotateBtn').addEventListener('click', rotateKey);
    document.getElementById('showLogBtn').addEventListener('click', showAudit);
    document.getElementById('resetBtn').addEventListener('click', resetMemory);

    const initialState = loadState();
    renderMessages(initialState);
    updateMeta(initialState);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./vivere-ai-sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
