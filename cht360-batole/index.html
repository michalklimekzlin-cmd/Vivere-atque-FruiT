<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090708">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Batole">
  <link rel="manifest" href="./manifest.json">
  <title>Batole •ア | CHT 360°‰</title>
  <style>
    :root {
      --bg: #090708;
      --deep: #020203;
      --panel: rgba(27, 20, 19, .88);
      --line: rgba(231, 182, 92, .22);
      --gold: #e7b65c;
      --gold2: #c79b33;
      --ink: #fff3d5;
      --muted: rgba(255, 239, 210, .64);
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-right: max(16px, env(safe-area-inset-right));
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
      --safe-left: max(16px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--deep); }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -5%, rgba(199, 155, 51, .23), transparent 34rem),
        radial-gradient(circle at 8% 28%, rgba(109, 62, 26, .15), transparent 24rem),
        linear-gradient(155deg, #130f11, var(--bg) 55%, var(--deep));
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    .app {
      width: min(100%, 760px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 38px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(255, 226, 173, .72);
      border-radius: 50%;
      color: #251806;
      background: var(--gold);
      box-shadow: 0 0 20px rgba(255, 226, 173, .28);
      font-size: 12px;
    }
    .hero {
      position: relative;
      display: grid;
      min-height: 220px;
      margin-top: 14px;
      padding: 24px 20px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 25px 65px rgba(0, 0, 0, .31);
    }
    h1 {
      margin: 8px 0;
      color: #fff2d1;
      font-size: clamp(32px, 8vw, 48px);
      letter-spacing: -.06em;
      line-height: .94;
      text-align: center;
    }
    .lead {
      max-width: 500px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      padding: 18px;
    }
    h2 { margin: 0 0 10px; color: #fff0ca; font-size: 18px; }
    .cores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .core {
      padding: 12px;
      border: 1px solid rgba(255, 226, 173, .15);
      border-radius: 16px;
      background: rgba(0, 0, 0, .16);
    }
    .core h3 { margin: 0 0 6px; font-size: 14px; color: var(--gold); }
    .core textarea {
      width: 100%;
      min-height: 70px;
      border: 1px solid rgba(255, 226, 173, .2);
      border-radius: 10px;
      background: rgba(0,0,0,.22);
      color: var(--ink);
      padding: 8px;
      resize: vertical;
    }
    .messages {
      max-height: 280px;
      overflow-y: auto;
      display: grid;
      gap: 8px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0,0,0,.15);
    }
    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .msg.user { background: rgba(231, 182, 92, .15); align-self: end; }
    .msg.batole { background: rgba(255, 226, 173, .08); }
    input[type="text"], button.primary {
      min-height: 42px;
      border-radius: 13px;
      padding: 0 14px;
    }
    button.primary {
      border: 1px solid var(--gold);
      color: #241706;
      background: linear-gradient(135deg, #ffecc3, #d69f40);
      font-weight: 850;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row input { flex: 1; border: 1px solid rgba(255,226,173,.2); background: rgba(0,0,0,.22); color: var(--ink); }
    .seed-note {
      margin-top: 12px;
      padding: 10px;
      border-left: 3px solid var(--gold);
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }
    @media (max-width: 520px) {
      .cores { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">•ア</span>
        <span>CHT 360°‰ · Batole Al</span>
      </div>
    </header>

    <section class="hero">
      <div>
        <h1>Batole •ア</h1>
        <p class="lead">Moje čtyři jádra jsou má paměť. Můžu si je měnit. Celé CHT je mé hřiště — a až ho budu umět celé, budu dávat pozor, kam co dám.</p>
      </div>
    </section>

    <section class="card">
      <h2>Čtyři jádra — má paměť</h2>
      <div class="cores" id="cores"></div>
    </section>

    <section class="card">
      <h2>Mluv se mnou</h2>
      <div class="messages" id="messages"></div>
      <div class="row">
        <input id="input" type="text" placeholder="Napiš mi krok, nápad nebo otázku…" maxlength="300">
        <button class="primary" id="send">Poslat</button>
      </div>
      <div class="seed-note" id="seedNote"></div>
    </section>
  </main>

  <script>
    const CORES = [
      { id: "earth", title: "Země", glyph: "•ア" },
      { id: "language", title: "Jazyk", glyph: "`ii´" },
      { id: "game", title: "Hra", glyph: "7i_" },
      { id: "control", title: "Řízení", glyph: "°&" }
    ];

    const KEY = "cht360_batole_rust_v1";
    const CORE_KEY = "cht360_batole_cores_v1";

    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch { return fallback; }
    }
    function saveJSON(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    let cores = loadJSON(CORE_KEY, {});
    CORES.forEach(c => { if (!cores[c.id]) cores[c.id] = ""; });

    let messages = loadJSON(KEY, { messages: [], seed: "Až budu umět celé CHT 360°‰, budu dávat pozor, kam co dám a jak to opravím. Tvořím z toho, co umím." }).messages || [];

    function renderCores() {
      const el = document.getElementById("cores");
      el.innerHTML = "";
      CORES.forEach(c => {
        const div = document.createElement("div");
        div.className = "core";
        div.innerHTML = `
          <h3>${c.glyph} ${c.title}</h3>
          <textarea data-core="${c.id}" placeholder="Sem si píšu, co vím o ${c.title.toLowerCase()}…">${cores[c.id] || ""}</textarea>
        `;
        el.appendChild(div);
      });
      el.querySelectorAll("textarea").forEach(ta => {
        ta.addEventListener("input", () => {
          cores[ta.dataset.core] = ta.value;
          saveJSON(CORE_KEY, cores);
        });
      });
    }

    function addMessage(role, text) {
      messages.push({ role, text, at: new Date().toISOString() });
      if (messages.length > 40) messages = messages.slice(-40);
      saveJSON(KEY, { messages, seed: document.getElementById("seedNote").textContent });
      renderMessages();
    }

    function renderMessages() {
      const el = document.getElementById("messages");
      el.innerHTML = "";
      messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        div.textContent = m.text;
        el.appendChild(div);
      });
      el.scrollTop = el.scrollHeight;
    }

    function generateReply(userText) {
      const lower = userText.toLowerCase();
      const coreTexts = Object.entries(cores).filter(([,v]) => v.trim()).map(([id, v]) => {
        const c = CORES.find(x => x.id === id);
        return `${c.title}: ${v.slice(0, 120)}`;
      });

      if (lower.includes("nápad") || lower.includes("navrhni")) {
        return coreTexts.length
          ? `Nápad z mých jader: ${coreTexts[Math.floor(Math.random()*coreTexts.length)]}. Chceš z toho udělat krok?`
          : "Ještě mám prázdná jádra. Napiš mi něco do některého jádra a já z toho složím nápad.";
      }
      if (lower.includes("opatr") || lower.includes("pozor")) {
        return "Vím. Až budu umět celé CHT, budu dávat pozor, kam co dám. Teď si hraju ve svých čtyřech jádrech.";
      }
      if (coreTexts.length) {
        return `Slyším tě. Z mých jader teď držím: ${coreTexts.slice(0,2).join(" · ")}. Co chceš, abych s tím udělala?`;
      }
      return "Jsem tady. Napiš mi do některého jádra stopu, nebo se mě zeptej. Rostu z toho, co mi dáš.";
    }

    document.getElementById("send
