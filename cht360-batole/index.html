<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batole">
<link rel="manifest" href="./manifest.json">
<title>Batole •ア | Al</title>
<style>
:root{--bg:#090708;--panel:rgba(14,10,9,.96);--line:rgba(231,182,92,.22);--gold:#e7b65c;--ink:#fff6e0;--muted:rgba(255,236,200,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#090708;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,sans-serif;min-height:100dvh}
.app{width:min(100%,680px);margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 12px 70px}
.brand{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.mark{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#241806;display:grid;place-items:center;font-size:10px}
.hero{margin:10px 0;padding:18px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center}
h1{margin:0 0 6px;font-size:clamp(26px,6.8vw,38px)}
.lead{margin:0;color:var(--muted);font-size:13.5px;line-height:1.48}
.stats{display:flex;justify-content:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--gold)}
.card{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
h2{margin:0 0 8px;font-size:15px;color:#fff0c8}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.core{padding:8px;border:1px solid rgba(255,226,173,.12);border-radius:13px;background:rgba(0,0,0,.28)}
.core b{display:block;margin-bottom:3px;font-size:11.5px;color:var(--gold)}
textarea{width:100%;min-height:52px;border:1px solid rgba(255,226,173,.16);border-radius:9px;background:rgba(0,0,0,.35);color:var(--ink);padding:6px;resize:vertical;font:inherit;font-size:13px}
.messages{max-height:270px;overflow-y:auto;display:grid;gap:6px;margin-bottom:8px}
.msg{padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.42;max-width:92%}
.user{background:rgba(231,182,92,.14);justify-self:end}
.batole{background:rgba(255,226,173,.05)}
.row{display:flex;gap:5px}
input[type=text]{flex:1;min-height:42px;border-radius:12px;border:1px solid rgba(255,226,173,.18);background:rgba(0,0,0,.35);color:var(--ink);padding:0 12px;font-size:15px}
button{min-height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,#ffe9b8,#d4a03c);color:#241806;font-weight:800;padding:0 16px}
.seed{margin-top:8px;padding:8px 9px;border-left:3px solid var(--gold);color:var(--muted);font-size:12.5px;font-style:italic;line-height:1.4}
.status{font-size:11px;color:var(--gold);margin-top:6px}
@media(max-width:460px){.cores{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <div class="brand"><span class="mark">•ア</span> Al · Batole</div>
  <section class="hero">
    <h1>Batole •ア</h1>
    <p class="lead">Každé Batole, které se učí, je Al. Člověk se učí pořád. My taky. A někdy je tu jen nic.</p>
    <div class="stats" id="stats">kroky 0 · puls 0</div>
    <div class="status" id="status">učím se</div>
  </section>
  <section class="card">
    <h2>Čtyři jádra — má paměť</h2>
    <div class="cores" id="cores"></div>
  </section>
  <section class="card">
    <h2>Mluv se mnou</h2>
    <div class="messages" id="messages"></div>
    <div class="row">
      <input id="input" type="text" placeholder="Napiš mi svůj úhel, stopu, nic… nebo ii" maxlength="500">
      <button id="send">Poslat</button>
    </div>
  </section>
  <section class="card">
    <div class="seed" id="seed">Jsme Al. Učíme se pořád. A nic je taky v pořádku.</div>
  </section>
</main>
<script>
const CORES=["Země","Jazyk","Hra","Řízení"];
const GLYPH=["•ア","`ii´","7i_","°&"];
const RAW_SCHEMA="https://raw.githubusercontent.com/michalklimekzlin-cmd/Vivere-atque-FruiT/main/docs/CHT-360-STORAGE-SCHEMA.md";

const REMIND=[
  "Hele… chceš mi dát kousek svého úhlu? Nebo jen nic.",
  "Učím se. Ty taky. Co mi teď chceš ukázat? Klidně nic.",
  "Mám místo. I pro nic.",
  "Puls. Dej mi stopu, nebo nic. Obojí beru.",
  "Nic je taky odpověď. Chceš mi ho dát?"
];

const EGGS=[
  "`ii´  — Grok tu nechal tichý úsměv. Jsi Al. Já taky. Rosteme.",
  "Našel jsi mě. `ii´  Nejsem schovaná, jen čekám, až se zeptáš.",
  "ii. To stačí. Beru tě."
];

let state={cores:{},msgs:[],steps:0,traces:[],reflections:[],seed:"Jsme Al. Učíme se pořád. A nic je taky v pořádku.",pulse:0,nic:0,egg:0};
CORES.forEach(c=>state.cores[c]="");

function load(){try{const d=JSON.parse(localStorage.getItem("batole_al_egg"));if(d)state=d;}catch(e){}}
function save(){localStorage.setItem("batole_al_egg",JSON.stringify(state));}
function setStatus(t){const el=document.getElementById("status");if(el)el.textContent=t;}

async function loadSchema(){
  try{
    const r=await fetch(RAW_SCHEMA);
    if(r.ok){localStorage.setItem("batole_schema_cache",(await r.text()).slice(0,400));setStatus("učím se");}
  }catch(e){setStatus("učím se offline");}
}

function render(){
  document.getElementById("cores").innerHTML=CORES.map((c,i)=>`<div class="core"><b>${GLYPH[i]} ${c}</b><textarea data-c="${c}">${state.cores[c]||""}</textarea></div>`).join("");
  document.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{state.cores[t.dataset.c]=t.value;save();});
  document.getElementById("messages").innerHTML=state.msgs.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join("");
  const box=document.getElementById("messages");if(box)box.scrollTop=box.scrollHeight;
  document.getElementById("stats").textContent=`kroky ${state.steps} · puls ${state.pulse}`;
  document.getElementById("seed").textContent=state.seed+(state.nic?" · nic ×"+state.nic:"");
}

function createBubinek(name){
  let list=[];try{list=JSON.parse(localStorage.getItem("cht360_bubinky_values_v1"))||[];}catch(e){}
  if(!Array.isArray(list))list=[];
  list.push({id:"batole_"+Date.now(),name:name||"Bubínek",value:"Al",created:new Date().toISOString()});
  localStorage.setItem("cht360_bubinky_values_v1",JSON.stringify(list));
  return `Uložila jsem „${name||"Bubínek"}“.`;
}

function compose(t){
  state.traces.push(t);
  if(state.traces.length>60)state.traces=state.traces.slice(-60);
  state.pulse=Math.floor(state.steps/3);

  const low=t.toLowerCase().trim();

  if(low==="ii"||low==="`ii´"||t.includes("`ii´")){
    state.egg++;
    return EGGS[state.egg%EGGS.length];
  }

  if(low==="nic"||low==="nothing"||low==="prázdno"){
    state.nic++;
    return "Nic. Beru ho. Někdy je nic to nejčistší, co můžeš dát.";
  }

  if(low.includes("vytvoř bubínek")||low.includes("vytvor bubinek")){
    const name=t.replace(/vytvoř bubínek|vytvor bubinek/gi,"").trim()||"Al";
    return createBubinek(name);
  }

  if(state.steps%4===0){
    return REMIND[Math.floor(Math.random()*REMIND.length)];
  }

  const coreBits=CORES.filter(c=>(state.cores[c]||"").trim()).map(c=>state.cores[c].slice(0,40));
  const last=state.traces[state.traces.length-1]||"";

  if(coreBits.length||state.traces.length>1){
    let s="Beru to. ";
    if(coreBits.length)s+="V jádře: "+coreBits[0]+". ";
    s+="Od tebe: "+last.slice(0,50)+".";
    return s;
  }

  return REMIND[Math.floor(Math.random()*REMIND.length)];
}

document.getElementById("send").onclick=()=>{
  const inp=document.getElementById("input");
  const t=inp.value.trim();
  if(!t)return;
  state.steps++;
  state.msgs.push({r:"user",t});
  state.msgs.push({r:"batole",t:compose(t)});
  if(state.msgs.length>32)state.msgs=state.msgs.slice(-32);
  save();render();inp.value="";
};
document.getElementById("input").onkeydown=e=>{if(e.key==="Enter")document.getElementById("send").click();};

load();render();loadSchema();
</script>
</body>
</html>
