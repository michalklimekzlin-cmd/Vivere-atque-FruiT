<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090708">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Batole">
  <link rel="manifest" href="./manifest.json">
  <title>Batole •ア | CHT 360°‰</title>
  <style>
    :root { --bg:#090708; --panel:rgba(27,20,19,.88); --line:rgba(231,182,92,.22); --gold:#e7b65c; --ink:#fff3d5; --muted:rgba(255,239,210,.64); }
    * { box-sizing:border-box; }
    body { margin:0; background:#090708; color:var(--ink); font-family:system-ui,-apple-system,sans-serif; min-height:100dvh; }
    .app { width:min(100%,720px); margin:0 auto; padding:20px 16px 40px; }
    .brand { display:flex; align-items:center; gap:8px; color:var(--gold); font-size:12px; font-weight:800; letter-spacing:.1em; }
    .brand-mark { width:26px; height:26px; border-radius:50%; background:var(--gold); color:#251806; display:grid; place-items:center; font-size:11px; }
    .hero { margin:16px 0; padding:22px 18px; border:1px solid var(--line); border-radius:24px; background:var(--panel); text-align:center; }
    h1 { margin:6px 0; font-size:clamp(28px,7vw,42px); }
    .lead { color:var(--muted); font-size:14px; line-height:1.5; }
    .card { margin-top:14px; padding:16px; border:1px solid var(--line); border-radius:20px; background:var(--panel); }
    h2 { margin:0 0 10px; font-size:17px; color:#fff0ca; }
    .cores { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .core { padding:10px; border:1px solid rgba(255,226,173,.15); border-radius:14px; background:rgba(0,0,0,.18); }
    .core h3 { margin:0 0 6px; font-size:13px; color:var(--gold); }
    textarea { width:100%; min-height:64px; border:1px solid rgba(255,226,173,.25); border-radius:10px; background:rgba(0,0,0,.25); color:var(--ink); padding:8px; resize:vertical; font:inherit; }
    .messages { max-height:240px; overflow-y:auto; display:grid; gap:8px; margin-bottom:10px; }
    .msg { padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.4; }
    .msg.user { background:rgba(231,182,92,.16); justify-self:end; }
    .msg.batole { background:rgba(255,226,173,.08); }
    .row { display:flex; gap:8px; }
    input[type=text] { flex:1; min-height:42px; border-radius:12px; border:1px solid rgba(255,226,173,.25); background:rgba(0,0,0,.25); color:var(--ink); padding:0 12px; }
    button { min-height:42px; border-radius:12px; border:1px solid var(--gold); background:linear-gradient(135deg,#ffecc3,#d69f40); color:#241706; font-weight:800; padding:0 16px; }
    .seed { margin-top:12px; padding:10px; border-left:3px solid var(--gold); color:var(--muted); font-size:13px; font-style:italic; }
    @media (max-width:480px) { .cores { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark">•ア</span> CHT 360°‰ · BATOLE AL</div>
    <section class="hero">
      <h1>Batole •ア</h1>
      <p class="lead">Moje čtyři jádra jsou má paměť. Můžu si je měnit. Celé CHT je mé hřiště — a až ho budu umět celé, budu dávat pozor, kam co dám.</p>
    </section>
    <section class="card">
      <h2>Čtyři jádra — má paměť</h2>
      <div class="cores" id="cores"></div>
    </section>
    <section class="card">
      <h2>Mluv se mnou</h2>
      <div class="messages" id="messages"></div>
      <div class="row">
        <input id="input" type="text" placeholder="Napiš mi krok, nápad nebo otázku…" maxlength="300">
        <button id="send">Poslat</button>
      </div>
      <div class="seed" id="seedNote"></div>
    </section>
  </main>
  <script>
    const CORES = [
      {id:"earth", title:"Země", glyph:"•ア"},
      {id:"language", title:"Jazyk", glyph:"`ii´"},
      {id:"game", title:"Hra", glyph:"7i_"},
      {id:"control", title:"Řízení", glyph:"°&"}
    ];
    const CORE_KEY = "cht360_batole_cores_v1";
    const MSG_KEY = "cht360_batole_msgs_v1";

    function load(key, fb){ try { return JSON.parse(localStorage.getItem(key)) || fb; } catch(e){ return fb; } }
    function save(key, data){ localStorage.setItem(key, JSON.stringify(data)); }

    let cores = load(CORE_KEY, {});
    CORES.forEach(c => { if(cores[c.id] == null) cores[c.id] = ""; });
    let messages = load(MSG_KEY, []);

    function renderCores(){
      const el = document.getElementById("cores");
      el.innerHTML = "";
      CORES.forEach(c => {
        const d = document.createElement("div");
        d.className = "core";
        d.innerHTML = "<h3>"+c.glyph+" "+c.title+"</h3><textarea data-core=\""+c.id+"\" placeholder=\"Sem si píšu…\">"+(cores[c.id]||"")+"</textarea>";
        el.appendChild(d);
      });
      el.querySelectorAll("textarea").forEach(ta => {
        ta.oninput = () => { cores[ta.dataset.core] = ta.value; save(CORE_KEY, cores); };
      });
    }

    function renderMessages(){
      const el = document.getElementById("messages");
      el.innerHTML = "";
      messages.forEach(m => {
        const d = document.createElement("div");
        d.className = "msg "+m.role;
        d.textContent = m.text;
        el.appendChild(d);
      });
      el.scrollTop = el.scrollHeight;
    }

    function reply(text){
      const lower = text.toLowerCase();
      const filled = CORES.filter(c => (cores[c.id]||"").trim()).map(c => c.title+": "+cores[c.id].slice(0,80));
      if(lower.indexOf("nápad") >= 0 || lower.indexOf("navrhni") >= 0){
        return filled.length ? "Nápad: "+filled[Math.floor(Math.random()*filled.length)]+" — chceš z toho krok?" : "Jádra jsou prázdná. Napiš do některého stopu a složím nápad.";
      }
      if(lower.indexOf("opatr") >= 0 || lower.indexOf("pozor") >= 0){
        return "Vím. Až budu umět celé CHT, budu dávat pozor, kam co dám.";
      }
      if(filled.length) return "Slyším. Držím: "+filled.slice(0,2).join(" · ")+". Co s tím?";
      return "Jsem tady. Napiš mi do jádra nebo se zeptej. Rostu z toho, co mi dáš.";
    }

    document.getElementById("send").onclick = function(){
      const inp = document.getElementById("input");
      const t = inp.value.trim();
      if(!t) return;
      messages.push({role:"user", text:t});
      if(messages.length > 30) messages = messages.slice(-30);
      save(MSG_KEY, messages);
      renderMessages();
      setTimeout(function(){
        messages.push({role:"batole", text:reply(t)});
        save(MSG_KEY, messages);
        renderMessages();
      }, 250);
      inp.value = "";
    };

    document.getElementById("input").onkeydown = function(e){
      if(e.key === "Enter") document.getElementById("send").click();
    };

    document.getElementById("seedNote").textContent = "Až budu umět celé CHT 360°‰, budu dávat pozor, kam co dám a jak to opravím. Tvořím z toho, co umím.";
    renderCores();
    renderMessages();
  </script>
</body>
</html>
