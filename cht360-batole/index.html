<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batole •ア</title>
<style>
body{margin:0;background:#090708;color:#fff3d5;font-family:system-ui;padding:20px}
.card{background:rgba(27,20,19,.9);border:1px solid rgba(231,182,92,.3);border-radius:16px;padding:16px;margin:12px 0}
h1,h2{margin:0 0 8px;color:#e7b65c}
textarea,input{width:100%;background:#000;color:#fff;border:1px solid #e7b65c;border-radius:8px;padding:8px;margin:4px 0}
button{background:#e7b65c;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:bold}
.msg{padding:8px;margin:4px 0;border-radius:8px}
.user{background:rgba(231,182,92,.2)}
.batole{background:rgba(255,255,255,.05)}
</style>
</head>
<body>
<h1>Batole •ア</h1>
<div class="card">
  <h2>Čtyři jádra</h2>
  <div id="cores"></div>
</div>
<div class="card">
  <h2>Mluv se mnou</h2>
  <div id="messages"></div>
  <input id="input" placeholder="Napiš…">
  <button id="send">Poslat</button>
</div>
<script>
const CORES=["Země","Jazyk","Hra","Řízení"];
let cores={}; let msgs=[];
CORES.forEach(c=>cores[c]="");
function save(){localStorage.setItem("batole",JSON.stringify({cores,msgs}));}
function load(){try{const d=JSON.parse(localStorage.getItem("batole"));if(d){cores=d.cores||cores;msgs=d.msgs||[];}}catch(e){}}
function render(){
  document.getElementById("cores").innerHTML=CORES.map(c=>`<div><b>${c}</b><br><textarea data-c="${c}">${cores[c]}</textarea></div>`).join("");
  document.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{cores[t.dataset.c]=t.value;save();});
  document.getElementById("messages").innerHTML=msgs.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join("");
}
document.getElementById("send").onclick=()=>{
  const t=document.getElementById("input").value.trim();
  if(!t)return;
  msgs.push({r:"user",t});
  msgs.push({r:"batole",t:"Slyším: "+t+". Jsem tady."});
  if(msgs.length>20)msgs=msgs.slice(-20);
  save(); render();
  document.getElementById("input").value="";
};
load(); render();
</script>
</body>
</html>
