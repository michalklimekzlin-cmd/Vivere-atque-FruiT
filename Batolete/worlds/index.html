<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>🌍 Světy – Batolete</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100dvh; background: #1a1a2e; color: #f0f0f0;
             font-family: system-ui, sans-serif; }
      .bar { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
             background: #16213e; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .back { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,.25);
              color: #fff; border-radius: 2rem; padding: .4rem .9rem; cursor: pointer;
              font-size: .9rem; font-family: inherit; }
      .back:hover { background: rgba(255,255,255,0.2); }
      h1 { color: #ffd700; font-size: 1.3rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
              gap: 1rem; padding: 1.25rem; }
      .world-card { display: flex; flex-direction: column; align-items: center; gap: .5rem;
                    padding: 1.25rem 1rem; border: 2px solid rgba(255,255,255,.1);
                    border-radius: 1.2rem; cursor: pointer; text-align: center;
                    transition: transform .15s, border-color .15s; color: #fff;
                    font-family: inherit; }
      .world-card:hover { transform: translateY(-3px); border-color: #e94560; }
      .world-card-icon { font-size: 2.5rem; }
      .world-card-name { font-weight: 800; font-size: .95rem; }
      .world-card-desc { font-size: .72rem; color: #aaa; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button class="back" onclick="history.back()">← Zpět na Hub</button>
      <h1>🌍 Světy VaFiT</h1>
    </div>
    <div class="grid" id="worldGrid"></div>
    <script src="./worlds.js"></script>
    <script>
      const grid = document.getElementById("worldGrid");
      WORLDS.forEach(w => {
        const btn = document.createElement("button");
        btn.className = "world-card";
        btn.style.background = `linear-gradient(135deg,${w.colors[0]},${w.colors[1]}44)`;
        btn.innerHTML = `<span class="world-card-icon">${w.emoji}</span>
          <span class="world-card-name">${w.name}</span>
          <span class="world-card-desc">${w.description}</span>`;
        btn.addEventListener("click", () => { window.location.href = w.url; });
        grid.appendChild(btn);
      });
    </script>
  </body>
</html>
