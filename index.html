<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VaF'ii'T · Glyph Grid</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --line: rgba(164, 171, 184, .18);
    --dot: rgba(190, 196, 207, .58);
    --glyph: #c4c7ce;
    --active: #eef0f5;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(76, 83, 99, .12), transparent 62%),
      #101114;
  }
  #app {
    position: fixed; inset: 0;
    padding: var(--safe-top) 0 var(--safe-bottom);
    overflow: hidden;
  }
  #grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: repeat(10, minmax(0, 1fr));
    isolation: isolate;
  }
  #grid::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background-image:
      linear-gradient(to right, transparent calc(100% - 1px), var(--line) calc(100% - 1px)),
      linear-gradient(to bottom, transparent calc(100% - 1px), var(--line) calc(100% - 1px));
    background-size: calc(100% / 12) calc(100% / 10);
    pointer-events: none;
  }
  .cell {
    position: relative; min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: visible;
  }
  .glyph {
    position: relative; z-index: 1;
    max-width: 94%; overflow: hidden; white-space: nowrap;
    color: var(--glyph);
    font-size: clamp(10px, 2.15vw, 15px);
    line-height: 1.1;
    letter-spacing: -.025em;
    text-align: center;
    text-overflow: clip;
    user-select: none;
    transform: rotate(var(--rotation, 0deg));
    transform-origin: center;
    transition: color .15s ease, text-shadow .15s ease;
    cursor: text;
    touch-action: manipulation;
  }
  .glyph.empty {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 5px rgba(190,196,207,.12);
    flex: 0 0 auto;
  }
  .cell:focus-within .glyph:not(.empty),
  .glyph.selected {
    color: var(--active);
    text-shadow: 0 0 9px rgba(210,220,255,.38);
  }
  .editor {
    width: 100%; max-width: 100%; min-width: 0;
    padding: 4px 1px;
    border: 0; border-bottom: 1px solid rgba(210,216,229,.7);
    border-radius: 0; outline: none;
    background: rgba(16,17,20,.88); color: #f0f1f5;
    text-align: center; font: inherit; font-size: clamp(10px, 2.15vw, 15px);
    letter-spacing: -.025em; touch-action: auto;
  }
  #hint {
    position: absolute; z-index: 5; left: 50%; bottom: calc(8px + var(--safe-bottom));
    transform: translateX(-50%);
    max-width: 90vw; padding: 5px 9px;
    color: rgba(205,209,218,.45); font-size: 10px; letter-spacing: .06em;
    white-space: nowrap; pointer-events: none; transition: opacity .6s ease;
  }
  #hint.hide { opacity: 0; }
  #reset {
    position: absolute; z-index: 10; top: calc(7px + var(--safe-top)); right: 8px;
    border: 1px solid rgba(190,196,207,.2); border-radius: 20px;
    background: rgba(16,17,20,.58); color: rgba(205,209,218,.62);
    padding: 5px 9px; font-size: 10px; letter-spacing: .04em;
    opacity: .35; touch-action: manipulation;
  }
  #reset:active { opacity: .9; }
  @media (orientation: portrait) {
    #grid { grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: repeat(12, minmax(0, 1fr)); }
    #grid::before { background-size: calc(100% / 10) calc(100% / 12); }
  }
  @media (prefers-reduced-motion: reduce) { .glyph { transition: none; } }
</style>
</head>
<body>
<main id="app" aria-label="VaF'ii'T Glyph Grid">
  <div id="grid" aria-label="Mřížka 120 míst"></div>
  <button id="reset" type="button" aria-label="Vymazat všechny uložené znaky">vymazat znaky</button>
  <div id="hint">KLEPNI NA TEČKU · ZAPIŠ AŽ 9 ZNAKŮ · KRUHOVÝM GESTEM OTÁČEJ SÍŤ</div>
</main>
<script>
(() => {
  const COUNT = 120;
  const MAX_CHARS = 9;
  const STORAGE_KEY = "VaFiT_GlyphGrid_v1";
  const grid = document.querySelector("#grid");
  const hint = document.querySelector("#hint");
  const resetButton = document.querySelector("#reset");
  let values = {};
  let rotation = 0;
  let activeEditor = null;
  let startAngle = null;
  let lastAngle = null;
  let gestureMoved = false;
  let hintTimer;

  try { values = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (_) { values = {}; }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(values)); } catch (_) {}
  }
  function showHint() {
    hint.classList.remove("hide");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add("hide"), 4200);
  }
  function angleAt(x, y) {
    const r = grid.getBoundingClientRect();
    return Math.atan2(y - (r.top + r.height / 2), x - (r.left + r.width / 2)) * 180 / Math.PI;
  }
  function shortestDelta(a, b) {
    let d = a - b;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    return d;
  }
  function applyRotation() {
    grid.querySelectorAll(".glyph").forEach(el => {
      el.style.setProperty("--rotation", `${rotation}deg`);
    });
  }
  function commitEditor(input, id) {
    const value = input.value.slice(0, MAX_CHARS);
    if (value.trim()) values[id] = value;
    else delete values[id];
    save();
    activeEditor = null;
    renderCell(id);
  }
  function renderCell(id) {
    const cell = grid.querySelector(`[data-id="${id}"]`);
    if (!cell) return;
    cell.replaceChildren();
    const glyph = document.createElement("span");
    glyph.className = "glyph" + (values[id] ? "" : " empty");
    glyph.textContent = values[id] || "";
    glyph.title = values[id] ? `Místo ${Number(id) + 1}: ${values[id]}` : `Prázdné místo ${Number(id) + 1}`;
    glyph.setAttribute("role", "button");
    glyph.setAttribute("aria-label", values[id] ? `Upravit znak ${values[id]}` : `Zapsat znak do místa ${Number(id) + 1}`);
    glyph.addEventListener("click", (event) => {
      event.stopPropagation();
      if (gestureMoved) return;
      openEditor(id, cell);
    });
    cell.append(glyph);
    glyph.style.setProperty("--rotation", `${rotation}deg`);
  }
  function openEditor(id, cell) {
    if (activeEditor) {
      const old = activeEditor;
      commitEditor(old.input, old.id);
    }
    const input = document.createElement("input");
    input.className = "editor";
    input.type = "text";
    input.maxLength = MAX_CHARS;
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;
    input.setAttribute("aria-label", `Znak ${Number(id) + 1}, nejvýše devět znaků`);
    input.value = values[id] || "";
    cell.replaceChildren(input);
    activeEditor = { input, id };
    input.addEventListener("input", () => {
      if (input.value.length > MAX_CHARS) input.value = input.value.slice(0, MAX_CHARS);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commitEditor(input, id); input.blur(); }
      if (e.key === "Escape") { input.value = values[id] || ""; commitEditor(input, id); input.blur(); }
    });
    input.addEventListener("blur", () => {
      if (activeEditor && activeEditor.input === input) commitEditor(input, id);
    });
    requestAnimationFrame(() => { input.focus({ preventScroll: true }); input.setSelectionRange(input.value.length, input.value.length); });
  }

  for (let i = 0; i < COUNT; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = String(i);
    grid.append(cell);
    renderCell(String(i));
  }

  // Circular pointer movement rotates every glyph together, counter-clockwise
  // relative to the user's clockwise movement. The lattice itself stays fixed.
  grid.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input, button")) return;
    if (activeEditor) {
      const current = activeEditor;
      commitEditor(current.input, current.id);
    }
    startAngle = angleAt(e.clientX, e.clientY);
    lastAngle = startAngle;
    gestureMoved = false;
    try { grid.setPointerCapture(e.pointerId); } catch (_) {}
  });
  grid.addEventListener("pointermove", (e) => {
    if (startAngle === null || activeEditor) return;
    const a = angleAt(e.clientX, e.clientY);
    const delta = shortestDelta(a, lastAngle);
    if (Math.abs(delta) > 0.1) {
      rotation -= delta;
      applyRotation();
      lastAngle = a;
      if (Math.abs(shortestDelta(a, startAngle)) > 3) gestureMoved = true;
    }
  });
  function endGesture() {
    startAngle = null;
    lastAngle = null;
    setTimeout(() => { gestureMoved = false; }, 80);
  }
  grid.addEventListener("pointerup", endGesture);
  grid.addEventListener("pointercancel", endGesture);
  grid.addEventListener("lostpointercapture", endGesture);

  resetButton.addEventListener("click", () => {
    if (!confirm("Opravdu vymazat všech 120 míst?")) return;
    values = {};
    save();
    if (activeEditor) activeEditor = null;
    for (let i = 0; i < COUNT; i++) renderCell(String(i));
    showHint();
  });

  // Avoid accidental browser zoom gestures while using the grid.
  document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
  document.addEventListener("contextmenu", e => e.preventDefault());
  showHint();
})();
</script>
</body>
</html>
