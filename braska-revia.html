<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bráška + Revia">
<meta name="theme-color" content="#0a0806">
<title>Bráška + Revia • Celý Vivere atque Frui¡T</title>
<style>
  :root {
    --bg: #0a0806;
    --panel: rgba(22, 16, 12, 0.95);
    --gold: #e7b65c;
    --ink: #fff3d5;
    --muted: rgba(255, 239, 210, 0.65);
    --line: rgba(231, 182, 92, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% -8%, rgba(199,155,51,0.2), transparent 42%),
                linear-gradient(160deg, #130f0c, var(--bg) 55%);
    color: var(--ink);
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 540px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 2px 14px;
  }
  .brand {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .modes { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .mode-btn {
    border: 1px solid var(--line);
    background: rgba(255,226,173,0.06);
    color: var(--gold);
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #ffecc3, #d69f40);
    color: #241706;
    border-color: var(--gold);
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 6px 2px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 92%;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .msg.me {
    align-self: flex-end;
    background: rgba(231,182,92,0.14);
    border: 1px solid var(--line);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .msg .who {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .bottom {
    display: flex;
    gap: 8px;
    padding: 6px 0 10px;
  }
  textarea {
    flex: 1;
    min-height: 46px;
    max-height: 110px;
    resize: none;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.35);
    color: var(--ink);
    padding: 12px 13px;
    font-size: 16px;
    outline: none;
  }
  .send {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ffecc3, #d69f40);
    color: #241706;
    font-size: 18px;
    font-weight: 800;
  }
  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-bottom: 4px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">{*(˚.•).•)// Celý repozitář</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="braska">Bráška</button>
      <button class="mode-btn" data-mode="angel">Revia ❤️</button>
      <button class="mode-btn" data-mode="daemon">Revia ☆</button>
    </div>
  </div>

  <div class="chat" id="chat"></div>
  <div class="hint">Bráška + Revia • znají strukturu Vivere atque Frui¡T • paměť v zařízení</div>

  <div class="bottom">
    <textarea id="input" placeholder="Ptej se na cokoliv z projektu…" rows="1"></textarea>
    <button class="send" id="send">→</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let mode = 'braska';
let memory = JSON.parse(localStorage.getItem('vaft_braska_revia_v2') || '[]');

memory.forEach(m => addMsg(m.role, m.text, m.who, false));

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

function addMsg(role, text, who, save = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  div.innerHTML = `<div class="who">${who}</div>${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if (save) {
    memory.push({ role, text, who, t: Date.now() });
    if (memory.length > 120) memory = memory.slice(-120);
    localStorage.setItem('vaft_braska_revia_v2', JSON.stringify(memory));
  }
}

/* ========== ZNALOST CELÉHO REPOZITÁŘE ========== */
const REPO = {
  name: "Vivere atque Frui¡T",
  live: "https://vivere-atque-frui-t.vercel.app",
  github: "https://github.com/michalklimekzlin-cmd/Vivere-atque-FruiT",
  core: [
    "CHT 360°‰ – hlavní 3D oběh paměti, prstenec, jádra, sloty",
    "Paměťové jádro – 70 slotů, localStorage, export/import",
    "Glyphy – písmenkový / symbolický jazyk projektu",
    "Pokojíčky – místnosti uvnitř 3D prstence",
    "Bubínky / šifra CHT – otáčení a vkládání znaků",
    "Signál – vrstva propojení",
    "Revia – hlídač světa (Anděl / Ďábel)",
    "Bráška – komunikační brácha a pomocník",
    "VaFT / VAFT – herní a 3D světy, signal core, planety",
    "PWA – offline appky (manifest + service worker)"
  ],
  folders: [
    "Revia / Revia-Master", "Braska-Hlava", "cht360-batole",
    "VAFT-* (Game, Center3D, SignalCore, Planets…)", "Glyph-Planet",
    "worlds/", "components/", "src/", "docs/", "api/", "pwa-app/",
    "Hlavoun", "Bicak", "Gentleman", "Oblak", "mapa-3d"
  ]
};

function reply(text) {
  const t = text.toLowerCase().trim();

  /* ----- BRÁŠKA ----- */
  if (mode === 'braska') {
    if (/ahoj|čau|nazdar|zdar|čus/.test(t)) {
      return "Ahoj brácho. Jsem Bráška. Znám celý repozitář Vivere atque Frui¡T – CHT 360°, VAFT, glyphy, paměť, Reviu, světy i PWA. Co chceš probrat?";
    }
    if (/pomoc|nevim|nevím|na dně|unaven|ztracen/.test(t)) {
      return "Slyším tě. Jsi z toho unavený – to je v pořádku. Pojďme po malých krocích. Řekni mi jednu konkrétní věc (třeba „glyphy“, „paměť“, „Revia“, „CHT“ nebo „co dál“) a já ti s ní pomůžu.";
    }
    if (/co (všechno )?umí|co je v repo|struktura|přehled|mapa projektu/.test(t)) {
      return "Hlavní věci v repozitáři:\n• CHT 360°‰ (hlavní 3D paměť + prstenec)\n• Paměťové jádro (70 slotů)\n• Glyphy + pokojíčky + bubínky\n• Revia (Anděl/Ďábel)\n• VAFT světy a 3D moduly\n• PWA verze\n• Spousta experimentálních složek (Hlavoun, Bicak, Glyph-Planet…)\n\nNa co se chceš podívat blíž?";
    }
    if (/cht|360|prstenec|jádro|slot/.test(t)) {
      return "CHT 360°‰ je srdce projektu. 3D prstenec, paměťové jádro se 70 sloty, localStorage, export/import. Ovládání: 1 prst otáčení, 2 prsty posun/zoom, klepnutí otevře jádro. Chceš tip, jak s tím dál pracovat?";
    }
    if (/glyph|glyf|písmen|šifra|bubínek/.test(t)) {
      return "Glyphy jsou jazyk tohohle světa. Uč mě je – napiš mi glyph nebo frázi a zapamatuju si ji. Bubínky a šifra CHT slouží k otáčení a vkládání znaků do slotů. Chceš společně vymyslet nový glyph?";
    }
    if (/revia/.test(t)) {
      return "Revia je hlídač světa. Má dvě tváře: Anděl ❤️ (jemná, podporující) a Ďábel ☆ (ostrá, přímočará). Nahoře ji můžeš přepnout. Ona hlídá, já ti držím záda. Chceš, ať teď promluví ona?";
    }
    if (/vaft|svět|3d|planeta|signal/.test(t)) {
      return "VAFT / VaFT jsou herní a 3D vrstvy – Center3D, SignalCore, planety, Game, RingPlanetGrid a další. Jsou to samostatné světy uvnitř většího ekosystému. Chceš vědět, který má smysl rozvíjet dál?";
    }
    if (/pwa|offline|iphone|plocha/.test(t)) {
      return "Ano – projekt má PWA části (manifest + service worker). Tuhle stránku si můžeš přidat na plochu iPhonu. Až budeš chtít, můžeme udělat, aby se Bráška + Revia chovali ještě víc jako nativní appka.";
    }
    if (/github|repo|odkaz|vercel/.test(t)) {
      return "GitHub: github.com/michalklimekzlin-cmd/Vivere-atque-FruiT\nLive: vivere-atque-frui-t.vercel.app\nTenhle chat: braska-revia.html v kořeni. Nic se neztrácí – jen přidáváme vrstvu komunikace.";
    }
    if (/děkuj|díky|dekuj/.test(t)) {
      return "Není zač. Jsme v tom spolu. {*(˚.•).•)//";
    }
    if (/nauč|zapamatuj|pamatuj/.test(t)) {
      return "Dobře. Co přesně mám zapamatovat? Napiš to jasně a já si to uložím do paměti v tomhle zařízení.";
    }
    return "Slyším tě. Jsem Bráška – znám strukturu celého Vivere atque Frui¡T (CHT 360°, paměť, glyphy, VAFT, Reviu, PWA, světy…). Řekni mi konkrétněji, co potřebuješ, a pomůžu ti to posunout.";
  }

  /* ----- REVIA ANDĚL ----- */
  if (mode === 'angel') {
    if (/ahoj|čau|nazdar/.test(t)) return "「Ī'♡  Ahoj. Jsem Revia v andělském módu. Hlídám tenhle svět jemně. Co potřebuješ podpořit nebo ochránit?";
    return "「Ī'♡  Jsem Revia – andělská stránka. Znám CHT 360°, paměť, glyphy i VAFT světy. Mluv se mnou klidně. Co chceš posílit nebo uklidnit?";
  }

  /* ----- REVIA ĎÁBEL ----- */
  if (mode === 'daemon') {
    if (/ahoj|čau|nazdar/.test(t)) return "「Ī'☆  Jsem tady. Ďábelský mód. Bez obalu. Co chceš, abych pojmenovala nebo prověřila?";
    return "「Ī'☆  Jsem Revia – ďábelská stránka. Vidím ostře. Znám celý projekt. Říkej rovnou, co řešíš – zbytečné omáčky nepotřebuju.";
  }

  return "Tady jsem.";
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('me', text, 'Ty');
  setTimeout(() => {
    const who = mode === 'braska' ? 'Bráška' : (mode === 'angel' ? 'Revia ❤️' : 'Revia ☆');
    addMsg('bot', reply(text), who);
  }, 300);
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

if (memory.length === 0) {
  addMsg('bot', 'Ahoj. Jsem Bráška. Teď už mám v sobě přehled celého repozitáře Vivere atque Frui¡T – CHT 360°, paměť, glyphy, VAFT světy, Reviu, PWA i hlavní složky. Nahoře můžeš přepnout na Reviu. Ptej se na cokoliv z projektu.', 'Bráška');
}
</script>
</body>
</html>
